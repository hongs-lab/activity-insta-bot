name: daily-post
on:
  schedule:
    - cron: "41 23 * * *" # 매일 08:41 KST. 00시(UTC)대는 전 세계 일일 cron이 몰려 5시간 넘게 밀린 적이 있어 그 직전으로 옮김
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} # Re-run은 예전 커밋을 받아와 posted.txt가 낡는다 → 항상 브랜치 최신으로
      - run: python3 post.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: 게시 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.txt
          # 실행 도중 다른 push가 들어와도 기록을 잃지 않게 rebase 후 push (기록이 빠지면 같은 공고가 또 올라간다)
          git diff --cached --quiet || { git commit -m "chore: record post" && git pull --rebase origin "${{ github.ref_name }}" && git push; }

name: daily-post
on:
  schedule:
    - cron: "7 0 * * *" # 매일 09:07 KST (정각은 Actions 지연이 심함)
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 post.py
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: 게시 기록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.txt
          git diff --cached --quiet || { git commit -m "chore: record post" && git push; }
